<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UNIVERSITY OF LAYYAH - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <style>
      :root {
        --ul-navy: #0c2340;
        --ul-navy-2: #112d4e;
        --ul-gold: #d7b563;
        --ul-gold-soft: #f6e7b1;
        --ul-bg: #f5f3ee;
        --ul-panel: #ffffff;
        --ul-border: #e4dfd6;
        --ul-text: #20314d;
        --ul-muted: #6a7280;
        --ul-shadow: 0 20px 50px rgba(13, 29, 51, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", sans-serif;
        background: var(--ul-bg);
        color: var(--ul-text);
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .login-shell {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .login-card {
        width: min(100%, 480px);
        background: var(--ul-panel);
        border: 1px solid var(--ul-border);
        border-radius: 16px;
        box-shadow: var(--ul-shadow);
        padding: 26px 28px 22px;
      }

      .brand {
        display: flex;
        justify-content: center;
        margin-bottom: 10px;
      }

      .brand a {
        display: inline-block;
      }

      .brand img {
        display: block;
        width: 220px;
        max-width: 100%;
        height: auto;
      }

      h2 {
        margin: 0 0 22px;
        text-align: center;
        font-size: clamp(1.8rem, 2vw, 2.2rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--ul-navy);
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field label,
      .label-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 0.92rem;
        font-weight: 600;
        color: var(--ul-navy);
      }

      .field label span,
      .label-row span {
        color: #d63939;
      }

      .input-wrap {
        position: relative;
        display: flex;
        align-items: center;
        height: 52px;
        border: 1px solid #d9d7d0;
        border-radius: 10px;
        background: #fff;
        overflow: hidden;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .input-wrap:focus-within {
        border-color: var(--ul-gold);
        box-shadow: 0 0 0 4px rgba(215, 181, 99, 0.18);
      }

      .input-wrap i {
        position: absolute;
        left: 16px;
        font-size: 1rem;
        color: #8f98a5;
      }

      .input-wrap select,
      .input-wrap input {
        width: 100%;
        height: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ul-text);
        font-size: 0.97rem;
        padding: 0 16px 0 46px;
        font-family: inherit;
      }

      .input-wrap select {
        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
        background-image: linear-gradient(45deg, transparent 50%, #516780 50%), linear-gradient(135deg, #516780 50%, transparent 50%);
        background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px);
        background-size: 6px 6px, 6px 6px;
        background-repeat: no-repeat;
        padding-right: 38px;
      }

      .input-wrap input::placeholder {
        color: #8b93a0;
      }

      .forgot {
        font-size: 0.8rem;
        color: var(--ul-navy);
        text-decoration: none;
        font-weight: 500;
      }

      .forgot:hover {
        text-decoration: underline;
      }

      .remember {
        display: flex;
        align-items: center;
        margin-top: -4px;
      }

      .remember label {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
        user-select: none;
        color: var(--ul-navy);
        font-size: 0.92rem;
        font-weight: 500;
      }

      .remember input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }

      .remember .check {
        width: 16px;
        height: 16px;
        display: inline-block;
        border: 1px solid #c3bfd1;
        border-radius: 4px;
        background: #fff;
        position: relative;
        transition: all 0.2s ease;
      }

      .remember input:checked + .check {
        background: var(--ul-gold);
        border-color: var(--ul-gold);
      }

      .remember input:checked + .check::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 1px;
        width: 4px;
        height: 8px;
        border: solid #0c2340;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
      }

      .login-btn {
        width: 100%;
        border: 0;
        border-radius: 10px;
        height: 52px;
        background: linear-gradient(180deg, var(--ul-navy-2) 0%, var(--ul-navy) 100%);
        color: #fff;
        font-size: 1.04rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 20px rgba(12, 35, 64, 0.2);
      }

      .login-btn:hover {
        transform: translateY(-1px);
      }

      .login-btn i {
        margin-right: 8px;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 22px 18px 18px;
        }

        .brand img {
          width: 180px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="brand">
          <a href="https://ul.edu.pk" target="_blank" rel="noopener noreferrer" aria-label="University of Layyah home">
            <img src="https://ul.edu.pk/storage/career/files/UL-Main-Logo-47ffb.png" alt="University of Layyah Logo" />
          </a>
        </div>

        <h2>Login</h2>

        <form>
          <div class="field">
            <label for="role">I am <span>*</span></label>
            <div class="input-wrap">
              <i class="fa-solid fa-user-tie"></i>
              <select id="role" name="role">
                <option selected>Employee</option>
                <option>Student</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label for="email">Email Address <span>*</span></label>
            <div class="input-wrap">
              <i class="fa-solid fa-envelope"></i>
              <input id="email" type="email" name="email" placeholder="Enter your email address" />
            </div>
          </div>

          <div class="field">
            <div class="label-row">
              <label for="password">Password <span>*</span></label>
              <a class="forgot" href="https://ul.edu.pk/forgot">Forgot password?</a>
            </div>
            <div class="input-wrap">
              <i class="fa-solid fa-lock"></i>
              <input id="password" type="password" name="password" placeholder="Enter your password" />
            </div>
          </div>

          <div class="remember">
            <label>
              <input type="checkbox" name="remember" />
              <span class="check"></span>
              Remember me
            </label>
          </div>

          <button class="login-btn" type="submit">
            <i class="fa-solid fa-right-to-bracket"></i>Login
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
